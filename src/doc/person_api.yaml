openapi: 3.1.0
info:
  title: People Collection API
  description: API for managing collection of Person-typed objects, including base and extra operations.
  version: 1.0.0

servers:
  - url: 'https://localhost:21212/api/v1'
    description: Helios

paths:
  /people:
    get:
      summary: Get whole collection of people.
      description: Returns list. Answer can be sorted, filtered, and supports pagination.
      operationId: getPeople
      parameters:
        - name: sortBy
          description: Field name to sort by.
          in: query
          required: false
          schema:
            type: string
            enum:
              - id
              - name
              - coordinates.x
              - coordinates.y
              - creationDate
              - height
              - eyeColor
              - hairColor
              - nationality
              - location.x
              - location.y
              - location.z
              - location.name
        - name: order
          in: query
          description: Sort order - asc or desc.
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - name: page
          in: query
          description: Page number.
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: pageSize
          in: query
          description: Size of page.
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
        - name: id
          in: query
          required: false
          description: Filter by ID.
          schema:
            type: integer
            minimum: 1
        - name: name
          in: query
          required: false
          description: Filter by name.
          schema:
            type: string
        - name: coordinates.x
          in: query
          required: false
          description: Filter by coordinates.x.
          schema:
            type: integer
        - name: coordinates.y
          in: query
          required: false
          description: Filter by coordinates.y.
          schema:
            type: integer
            minimum: -540
        - name: creationDate
          in: query
          required: false
          description: Filter by creation date.
          schema:
            type: string
            format: date-time
        - name: height
          in: query
          required: false
          description: Filter by height.
          schema:
            type: integer
            minimum: 1
        - name: eyeColor
          in: query
          required: false
          description: Filter by eye color.
          schema:
            $ref: '#/components/schemas/EyeColor'
        - name: hairColor
          in: query
          required: false
          description: Filter by hair color.
          schema:
            $ref: '#/components/schemas/HairColor'
        - name: nationality
          in: query
          required: false
          description: Filter by nationality.
          schema:
            $ref: '#/components/schemas/Country'
        - name: location.x
          in: query
          required: false
          description: Filter by location X.
          schema:
            type: integer
        - name: location.y
          in: query
          required: false
          description: Filter by location Y.
          schema:
            type: number
            format: float
        - name: location.z
          in: query
          required: false
          description: Filter by location Z.
          schema:
            type: number
            format: float
        - name: location.name
          in: query
          required: false
          description: Filter by location name.
          schema:
            type: string
            maxLength: 890
      tags:
        - People
      responses:
        '200':
          description: Returns list of people.
          content:
            application/xml:
              schema:
                type: array
                xml:
                  name: people
                  wrapped: true
                items:
                  $ref: '#/components/schemas/Person'
        '400':
          description: Bad Request - invalid parameter value.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 400
                message: Invalid parameter value
        '500':
          description: Internal Server Error.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 500
                message: Internal server error
        '503':
          description: Service unavailable
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 503
                message: Service is temporarily unavailable

    post:
      summary: Add new person to the collection.
      description: Create and add a new person to the collection.
      operationId: addPerson
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/Person'
      tags:
        - People
      responses:
        '201':
          description: Person successfully created.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          description: Bad Request - invalid parameter value.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 400
                message: Invalid parameter value
        '500':
          description: Internal Server Error.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 500
                message: Internal server error
        '503':
          description: Service unavailable
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 503
                message: Service is temporarily unavailable

  /people/{id}:
    get:
      summary: Get person by ID.
      description: Returns person.
      operationId: getById
      parameters:
        - name: id
          description: Person ID.
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            example: 1
      tags:
        - People
      responses:
        '200':
          description: Returns person by ID.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          description: Bad Request - invalid parameter value.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 400
                message: Invalid parameter value
        '404':
          description: Object is not found.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 404
                message: Person not found
        '500':
          description: Internal Server Error.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 500
                message: Internal server error
        '503':
          description: Service unavailable
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 503
                message: Service is temporarily unavailable

    put:
      summary: Update person by ID.
      description: Updates an existing person by its ID.
      operationId: updatePerson
      parameters:
        - name: id
          description: Person ID.
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            example: 1
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/Person'
      tags:
        - People
      responses:
        '200':
          description: Person successfully updated.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          description: Bad Request - invalid parameter value.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 400
                message: Invalid parameter value
        '404':
          description: Object is not found.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 404
                message: Person not found
        '500':
          description: Internal Server Error.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 500
                message: Internal server error
        '503':
          description: Service unavailable
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 503
                message: Service is temporarily unavailable

    delete:
      summary: Delete person by ID.
      description: Deletes an existing person by its ID.
      operationId: deletePerson
      parameters:
        - name: id
          description: Person ID.
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            example: 1
      tags:
        - People
      responses:
        '204':
          description: Person successfully deleted.
        '400':
          description: Bad Request - invalid parameter value.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 400
                message: Invalid parameter value
        '404':
          description: Object is not found.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 404
                message: Person not found
        '500':
          description: Internal Server Error.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 500
                message: Internal server error
        '503':
          description: Service unavailable
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 503
                message: Service is temporarily unavailable

  /people/hair-color-max:
    get:
      summary: Get a person with the maximum hair color.
      description: Returns any person whose hair color has the maximum value.
      operationId: getMaxHairColor
      tags:
        - People
      responses:
        '200':
          description: Person with the maximum hair color value.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Person'
        '500':
          description: Internal Server Error.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 500
                message: Internal server error
        '503':
          description: Service unavailable
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 503
                message: Service is temporarily unavailable

  /people/hair-color-less:
    get:
      summary: Get objects with hair color less than the specified color.
      description: Returns people whose hair color is less than the specified color.
      operationId: hairColorLess
      tags:
        - People
      parameters:
        - name: color
          description: Hair color.
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/HairColor'

      responses:
        '200':
          description: Successfully found matching people.
          content:
            application/xml:
              schema:
                type: array
                xml:
                  name: people
                  wrapped: true
                items:
                  $ref: '#/components/schemas/Person'
        '400':
          description: Bad Request - invalid hair color value.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 400
                message: Invalid parameter value
        '500':
          description: Internal Server Error.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 500
                message: Internal server error
        '503':
          description: Service unavailable
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 503
                message: Service is temporarily unavailable

  /people/group-by-id:
    get:
      summary: Group people by ID and return the number of elements in each group.
      description: Returns the number of people for each distinct ID value.
      operationId: groupById
      tags:
        - People
      responses:
        '200':
          description: Successfully grouped people by ID.
          content:
            application/xml:
              schema:
                type: object
                xml:
                  name: groups
                additionalProperties:
                  type: integer
                  example: 2
        '500':
          description: Internal Server Error.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 500
                message: Internal server error
        '503':
          description: Service unavailable
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 503
                message: Service is temporarily unavailable

components:
  schemas:
    Person:
      type: object
      xml:
        name: person
      required:
        - name
        - coordinates
        - height
        - eyeColor
        - hairColor
        - nationality
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          readOnly: true
          xml:
            name: id
        name:
          type: string
          minLength: 1
          example: Alex
          xml:
            name: name
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        creationDate:
          type: string
          format: date-time
          readOnly: true
          example: '2026-09-10T15:30:00'
          xml:
            name: creationDate
        height:
          type: integer
          format: int64
          minimum: 1
          example: 180
          xml:
            name: height
        eyeColor:
          $ref: '#/components/schemas/EyeColor'
        hairColor:
          $ref: '#/components/schemas/HairColor'
        nationality:
          $ref: '#/components/schemas/Country'
        location:
          anyOf:
            - $ref: '#/components/schemas/Location'
            - type: 'null'

    Coordinates:
      type: object
      xml:
        name: coordinates
      required:
        - x
        - y
      properties:
        x:
          type: integer
          format: int64
          example: 100
          xml:
            name: x
        y:
          type: integer
          format: int32
          minimum: -540
          example: 200
          xml:
            name: y

    Location:
      type: object
      xml:
        name: location
      required:
        - x
        - y
        - z
        - name
      properties:
        x:
          type: integer
          format: int32
          example: 100
          xml:
            name: x
        y:
          type: number
          format: float
          example: 20.5
          xml:
            name: y
        z:
          type: number
          format: float
          example: 30.5
          xml:
            name: z
        name:
          type: string
          maxLength: 890
          example: Moscow
          xml:
            name: name

    EyeColor:
      type: string
      enum:
        - RED
        - BLACK
        - BLUE

    HairColor:
      type: string
      enum:
        - BLACK
        - BLUE
        - WHITE
        - BROWN

    Country:
      type: string
      enum:
        - ITALY
        - THAILAND
        - NORTH_KOREA
        - JAPAN

    Error:
      type: object
      xml:
        name: error
      properties:
        code:
          type: integer
          example: 400
          xml:
            name: code
        message:
          type: string
          example: Invalid parameter value
          xml:
            name: message